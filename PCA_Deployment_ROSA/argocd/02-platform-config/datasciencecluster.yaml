# Patch DataScienceCluster for KServe RawDeployment mode (required for llm-d + Gateway API)
# The DSC is created by the RHOAI operator; this resource ensures the correct configuration.
#
# NOTE: this cluster runs RHOAI 3.5.1 (see 01-operators/subscriptions.yaml — the
# LLMInferenceService CRD / Distributed Inference with llm-d requires RHOAI 3.0+,
# not available in the originally-configured 2.19). The DataScienceCluster CRD
# schema changed substantially between 2.19 (v1) and 3.5 (v2):
#   - kserve.serving (Knative-Serverless config) no longer exists — "Only
#     RawDeployment mode is supported" per the v2 schema description, so there is
#     no more Serverless/Managed vs RawDeployment choice to make and no more
#     Service-Mesh-based ServiceMeshMember dependency at all.
#   - kserve.defaultDeploymentMode no longer exists (same reason).
#   - modelmeshserving component was removed entirely in 3.5 (ack-3.5-removed-
#     modelmeshserving) — there is no such field on the v2 CRD.
#   - datasciencepipelines was renamed to aipipelines.
---
apiVersion: datasciencecluster.opendatahub.io/v1
kind: DataScienceCluster
metadata:
  name: default-dsc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  components:
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headed
    # Not needed for this deployment (LLM serving + DevSpaces + llm-d routing).
    modelregistry:
      managementState: Removed
    dashboard:
      managementState: Managed
    aipipelines:
      managementState: Managed
    workbenches:
      managementState: Managed
