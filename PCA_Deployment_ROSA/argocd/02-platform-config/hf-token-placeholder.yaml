# HuggingFace token secret — PLACEHOLDER
# Replace REPLACE_WITH_BASE64_HF_TOKEN with: echo -n 'hf_your_token' | base64
# For production, use External Secrets Operator or Sealed Secrets instead.
---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: ai-serving
  annotations:
    argocd.argoproj.io/sync-wave: "1"
type: Opaque
data:
  # Intentionally empty in git (public repo) — the real token is live-patched
  # directly onto the cluster and protected from selfHeal via this Application's
  # spec.ignoreDifferences (see 00-app-of-apps.yaml). Never commit a real token here.
  token: ""
