# Persistent Volume Claims for model weight caching.
# Using PVCs avoids re-downloading models on pod restarts (~30GB for Qwen3.8-27B).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: ai-serving
  annotations:
    # Must be the SAME sync-wave as the LLMInferenceService (wave 2), not an
    # earlier one. gp3-csi uses VolumeBindingMode: WaitForFirstConsumer, so this
    # PVC stays Pending until a pod (created by LLMInferenceService) references
    # it. If the PVC is in an earlier wave, ArgoCD's wave-gate deadlocks forever:
    # it won't advance past the PVC's wave until the PVC is Healthy/Bound, but
    # the PVC can't bind until the later wave (that creates the consuming pod)
    # is allowed to apply. Same wave = applied together, no gate in between.
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 100Gi
